name: Windows Installer

# Builds SoftProjector on a Windows runner, deploys the Qt runtime with
# windeployqt, packages an Inno Setup installer named
# SoftProjector_<version>_WinInstaller.exe, and:
#   - on a pushed tag like v2.2  -> attaches it to a GitHub Release
#   - on manual dispatch         -> uploads it as a downloadable build artifact
#
# Note: this is fork-only packaging. It cannot be run/verified from the Linux
# dev environment; trigger it via the Actions tab (Run workflow) to test.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string for the installer name (e.g. 2.2)'
        required: true
        default: '2.2'

permissions:
  contents: write   # needed to attach the installer to a Release

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            v="${GITHUB_REF_NAME#v}"      # strip leading 'v' from the tag
          else
            v="${{ github.event.inputs.version }}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building installer for version $v"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: 'qtmultimedia'

      - name: Build (release)
        shell: cmd
        # Enter the MSVC environment in the same step: vcvars64 only sets
        # variables for this shell, and no third-party action is needed.
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSPATH=%%i"
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          rem windeployqt --compiler-runtime runs in a later step and needs
          rem VCINSTALLDIR to find vc_redist.x64.exe, so export it.
          echo VCINSTALLDIR=%VCINSTALLDIR%>>"%GITHUB_ENV%"
          echo VCToolsRedistDir=%VCToolsRedistDir%>>"%GITHUB_ENV%"
          cd src
          qmake softProjector.pro CONFIG+=release
          nmake

      - name: Deploy Qt runtime (windeployqt)
        shell: cmd
        run: |
          windeployqt --release --compiler-runtime --qmldir src\qml src\win32_build\bin\SoftProjector.exe || exit /b 1
          rem The installer script skips a missing vc_redist silently, so
          rem fail here instead of shipping an installer without the runtime.
          if not exist src\win32_build\bin\vc_redist.x64.exe (
            echo ::error::windeployqt did not copy vc_redist.x64.exe; is VCINSTALLDIR set?
            exit /b 1
          )

      - name: Add SoftProjector translations
        shell: cmd
        run: |
          if not exist src\win32_build\bin\translations mkdir src\win32_build\bin\translations
          copy /Y src\translations\softpro_*.qm src\win32_build\bin\translations\

      - name: List packaged files
        # Full manifest with sizes, so a change in installer size can be
        # explained from the log after the artifact and the runner are gone.
        shell: cmd
        run: dir /s /-c src\win32_build\bin

      - name: Install Inno Setup
        shell: cmd
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: cmd
        run: |
          "%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.ver.outputs.version }} packaging\windows\softprojector.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: SoftProjector_${{ steps.ver.outputs.version }}_WinInstaller
          path: packaging/windows/output/*.exe
          if-no-files-found: error

      - name: Attach installer to GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          files: packaging/windows/output/*.exe
